<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CAMISETA OVERSIZE — CATEGORYALIEN</title>

    <link rel="stylesheet" href="style.css">

</head>

<body class="shop-page">

    <header class="shop-header">

        <a href="index.html" class="shop-logo">
            CATEGORYALIEN
        </a>

        <div class="shop-tools">

            <a href="women.html">WOMEN</a>

            <a href="#">CUENTA</a>

            <a href="carrito.html">CARRITO</a>

        </div>

    </header>


    <main class="product-page">

        <div class="product-detail">


            <div class="product-detail-image">

                <img
                    src="camiseta-oversize.png"
                    alt="Camiseta Oversize CATEGORYALIEN"
                >

            </div>


            <div class="product-detail-info">

                <p class="product-brand">
                    CATEGORYALIEN
                </p>

                <h1>
                    CAMISETA OVERSIZE
                </h1>

                <p class="product-category">
                    CAMISETA
                </p>

                <p class="product-price">
                    25 €
                </p>


                <!-- TALLAS -->

                <div class="product-size">

                    <p class="size-title">
                        TALLA
                    </p>


                    <div class="size-options">

                        <button
                            type="button"
                            onclick="selectSize('S')"
                            class="size-button"
                        >
                            S
                        </button>

                        <button
                            type="button"
                            onclick="selectSize('M')"
                            class="size-button"
                        >
                            M
                        </button>

                        <button
                            type="button"
                            onclick="selectSize('L')"
                            class="size-button"
                        >
                            L
                        </button>

                        <button
                            type="button"
                            onclick="selectSize('XL')"
                            class="size-button"
                        >
                            XL
                        </button>

                        <button
                            type="button"
                            onclick="selectSize('XXL')"
                            class="size-button"
                        >
                            XXL
                        </button>

                    </div>


                    <p id="selected-size">
                        SELECCIONA UNA TALLA
                    </p>

                </div>


                <!-- AÑADIR AL CARRITO -->

                <button
                    class="add-cart"
                    onclick="addToCart()"
                >
                    AÑADIR AL CARRITO
                </button>


            </div>

        </div>

    </main>


    <script>

        let selectedSize = null;


        function selectSize(size) {

            selectedSize = size;


            document.getElementById("selected-size").textContent =
                "TALLA SELECCIONADA: " + size;


            const buttons =
                document.querySelectorAll(".size-button");


            buttons.forEach(button => {

                button.style.background = "transparent";
                button.style.color = "white";

            });


            event.target.style.background = "white";
            event.target.style.color = "black";

        }


        function addToCart() {

            if (!selectedSize) {

                alert("SELECCIONA UNA TALLA");

                return;

            }


            const product = {

                name: "CAMISETA OVERSIZE",

                brand: "CATEGORYALIEN",

                category: "CAMISETA",

                price: 25,

                image: "camiseta-oversize.png",

                size: selectedSize,

                quantity: 1

            };


            let cart = JSON.parse(
                localStorage.getItem("cart")
            ) || [];


            const existingProduct = cart.find(
                item =>
                    item.name === product.name &&
                    item.size === product.size
            );


            if (existingProduct) {

                existingProduct.quantity += 1;

            } else {

                cart.push(product);

            }


            localStorage.setItem(
                "cart",
                JSON.stringify(cart)
            );


            window.location.href = "carrito.html";

        }

    </script>


</body>

</html>
