<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PANTALÓN VESTIR — CATEGORYALIEN</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="shop-page">

    <header class="shop-header">

        <a href="index.html" class="shop-logo">
            CATEGORYALIEN
        </a>

        <div class="shop-tools">
            <a href="men.html">MEN</a>
            <a href="#">CUENTA</a>
            <a href="carrito.html">CARRITO</a>
        </div>

    </header>


    <main class="product-page">

        <div class="product-detail">

            <div class="product-detail-image">

                <img
                    src="bunnies-pantalon-vestir.png"
                    alt="Pantalón Vestir BUNIIESINDUSTRIES"
                >

            </div>


            <div class="product-detail-info">

                <p class="product-brand">
                    BUNIIESINDUSTRIES
                </p>

                <h1>
                    PANTALÓN VESTIR
                </h1>

                <p class="product-category">
                    VESTIR
                </p>

                <p class="product-price">
                    50 €
                </p>


                <!-- TALLAS -->

                <div class="product-size">

                    <p class="size-title">
                        TALLA
                    </p>

                    <div class="size-options">

                        <button type="button" onclick="selectSize('38')" class="size-button">
                            38
                        </button>

                        <button type="button" onclick="selectSize('40')" class="size-button">
                            40
                        </button>

                        <button type="button" onclick="selectSize('42')" class="size-button">
                            42
                        </button>

                        <button type="button" onclick="selectSize('44')" class="size-button">
                            44
                        </button>

                        <button type="button" onclick="selectSize('46')" class="size-button">
                            46
                        </button>

                    </div>

                    <p id="selected-size">
                        SELECCIONA UNA TALLA
                    </p>

                </div>


                <!-- AÑADIR AL CARRITO -->

                <button class="add-cart" onclick="addToCart()">
                    AÑADIR AL CARRITO
                </button>

            </div>

        </div>

    </main>


    <script>

        let selectedSize = null;


        function selectSize(size) {

            selectedSize = size;

            document.getElementById("selected-size").textContent =
                "TALLA SELECCIONADA: " + size;


            const buttons =
                document.querySelectorAll(".size-button");


            buttons.forEach(button => {

                button.style.background = "transparent";
                button.style.color = "white";

            });


            event.target.style.background = "white";
            event.target.style.color = "black";

        }


        function addToCart() {

            if (!selectedSize) {

                alert("SELECCIONA UNA TALLA");

                return;

            }


            const product = {

                name: "PANTALÓN VESTIR",

                brand: "BUNIIESINDUSTRIES",

                category: "VESTIR",

                price: 50,

                image: "bunnies-pantalon-vestir.png",

                size: selectedSize,

                quantity: 1

            };


            let cart = JSON.parse(
                localStorage.getItem("cart")
            ) || [];


            const existingProduct = cart.find(
                item =>
                    item.name === product.name &&
                    item.size === product.size
            );


            if (existingProduct) {

                existingProduct.quantity += 1;

            } else {

                cart.push(product);

            }


            localStorage.setItem(
                "cart",
                JSON.stringify(cart)
            );


            window.location.href = "carrito.html";

        }

    </script>


</body>

</html>
