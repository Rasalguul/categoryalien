<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PANTALÓN VESTIR — CATEGORYALIEN</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="shop-page">

    <header class="shop-header">

        <a href="index.html" class="shop-logo">
            CATEGORYALIEN
        </a>

        <div class="shop-tools">
            <a href="men.html">MEN</a>
            <a href="#">CUENTA</a>
            <a href="carrito.html">CARRITO</a>
        </div>

    </header>


    <main class="product-page">

        <div class="product-detail">

            <div class="product-detail-image">

                <img
                    src="bunnies-pantalon-vestir.png"
                    alt="Pantalón Vestir BUNIIESINDUSTRIES"
                >

            </div>


            <div class="product-detail-info">

                <p class="product-brand">
                    BUNIIESINDUSTRIES
                </p>

                <h1>
                    PANTALÓN VESTIR
                </h1>

                <p class="product-category">
                    VESTIR
                </p>

                <p class="product-price">
                    50 €
                </p>

                <button class="add-cart" onclick="addToCart()">
                    AÑADIR AL CARRITO
                </button>

            </div>

        </div>

    </main>


    <script>

        function addToCart() {

            const product = {
                name: "PANTALÓN VESTIR",
                brand: "BUNIIESINDUSTRIES",
                category: "VESTIR",
                price: 50,
                image: "bunnies-pantalon-vestir.png",
                quantity: 1
            };


            let cart = JSON.parse(
                localStorage.getItem("cart")
            ) || [];


            const existingProduct = cart.find(
                item => item.name === product.name
            );


            if (existingProduct) {

                existingProduct.quantity += 1;

            } else {

                cart.push(product);

            }


            localStorage.setItem(
                "cart",
                JSON.stringify(cart)
            );


            window.location.href = "carrito.html";

        }

    </script>


</body>

</html>
